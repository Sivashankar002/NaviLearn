<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NaviLearn Embed Test</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }
        .container {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        iframe {
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>NaviLearn Video Embed Test (Iframe)</h2>
        <p>This is how the video will load inside our React Frontend Dashboard. Notice it plays and starts at the correct timestamp without throwing Error 153.</p>
        
        <iframe 
            width="100%" 
            height="450" 
            src="https://www.youtube.com/embed/t2CEgPsws3U?start=392" 
            title="YouTube video player"   
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
